services:
  backend:
    build: .
    # No `ports:` on purpose. The API is reached only over the shared network,
    # by the frontend container. Publishing 8003 to the host put an
    # unauthenticated API on every interface of the deploy box; the router NAT
    # was the only thing keeping it off the internet.
    expose:
      - "8003"
    environment:
      PORT: 8003
      # The data lives in Atlas (.env); the local `mongo` service is only the
      # fallback for a checkout without one. Hard-coding it here served an
      # empty database in production.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-bangkoktor}
      NODE_ENV: production
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN must be set in .env}
      # .env is dockerignored, so only what is listed here reaches the
      # container. Must equal the frontend's value: it verifies the user JWT
      # the frontend signs, and the server refuses to start without it.
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?INTERNAL_JWT_SECRET must be set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3003}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - default
      - bangkoktor
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      # Loopback-only so `bun run dev` on the host can reach it without
      # exposing the DB on the deploy server's public interface.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  # Mongo stays on `default` only — it is never reachable from the frontend or
  # the proxy, which is the point of keeping two networks rather than one.
  bangkoktor:
    external: true
    name: bangkoktor-net
